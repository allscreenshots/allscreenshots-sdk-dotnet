name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore SDK dependencies
        working-directory: sdk
        run: dotnet restore

      - name: Build SDK
        working-directory: sdk
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        working-directory: sdk
        run: dotnet test tests/AllScreenshots.Sdk.Tests.Unit --no-build --configuration Release --verbosity normal

      - name: Pack NuGet package
        working-directory: sdk
        run: dotnet pack src/AllScreenshots.Sdk --no-build --configuration Release --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: sdk/artifacts/*.nupkg

  build-sample-app:
    name: Build sample app
    runs-on: ubuntu-latest
    needs: build-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore sample app dependencies
        working-directory: sample-app
        run: dotnet restore

      - name: Build sample app
        working-directory: sample-app
        run: dotnet build --no-restore --configuration Release

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-sdk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore SDK dependencies
        working-directory: sdk
        run: dotnet restore

      - name: Build SDK
        working-directory: sdk
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests
        working-directory: sdk
        env:
          ALLSCREENSHOTS_API_KEY: ${{ secrets.ALLSCREENSHOTS_API_KEY }}
        run: dotnet test tests/AllScreenshots.Sdk.Tests.Integration --no-build --configuration Release --verbosity normal

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: sdk/tests/AllScreenshots.Sdk.Tests.Integration/test-report.html
          if-no-files-found: ignore
